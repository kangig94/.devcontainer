# Isaac Lab overlay — use with: -f docker-compose.yml -f docker-compose.isaaclab.yml
name: isaaclab

services:
  lab:
    image: ${DOCKER_REGISTRY:-local}/isaaclab:${PY_TAG:-py312}-${ISAACLAB_TAG:-3.0.0-beta2.patch1}
    build:
      context: ..
      dockerfile: isaaclab/Dockerfile
      network: host
      args:
        # Default Makefile path uses the generic uv-torch base. Set
        # `isolate=true` to build/use the lightweight isaaclab-base instead.
        BASE_IMAGE: ${DOCKER_REGISTRY:-your-registry}/${ISAACLAB_BASE_IMAGE_NAME:-uv-torch}:${PY_TAG:-py312}-${TORCH_VERSION:-2.10.0}-${CUDA_TAG:-cu128}
        ISAACLAB_VERSION: ${ISAACLAB_VERSION:-v3.0.0-beta2.patch1}
        ISAACLAB_PROFILE: ${ISAACLAB_PROFILE:-isaacsim-6.0-py312-cu128}
        OFFLINE_ASSETS: ${ISAACLAB_OFFLINE_ASSETS:-false}
        ISAAC_ASSET_ROOT: ${ISAAC_ASSET_ROOT:-}
        HEADLESS_ASSET_EXTENSIONS: ${ISAACLAB_HEADLESS_ASSET_EXTENSIONS:-false}
        URDF_IMPORTER_VERSION: ${URDF_IMPORTER_VERSION:-}
    # base attaches `lab` to dev_network (192.168.10/24, NAS-safe);
    # isaaclab uses host networking, which is mutually exclusive with `networks`.
    network_mode: host
    networks: !reset null
    # Host network makes published port mapping a no-op; clear to avoid the
    # "Published ports are discarded when using host network mode" warning.
    ports: !reset null
    command: [ "bash", "-l" ]

    environment:
      - VIRTUAL_ENV=/opt/venv
      - UV_EXTRA_INDEX_URL=https://pypi.nvidia.com
      - UV_INDEX_STRATEGY=unsafe-best-match
      - PIP_EXTRA_INDEX_URL=https://pypi.nvidia.com
      - PIP_FIND_LINKS=https://py.mujoco.org/
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      # Display forwarding for Isaac Sim GUI (ignored if DISPLAY is unset)
      - DISPLAY=${DISPLAY:-}
      # NCCL multi-node (harmless when single-node)
      - NCCL_SOCKET_IFNAME=^docker0,lo
      - NCCL_IB_DISABLE=1
